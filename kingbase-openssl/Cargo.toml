[package]
name = "kingbase-openssl"
version = "0.5.3"
authors = ["Steven Fackler <sfackler@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "TLS support for tokio-kingbase via openssl"
repository = "https://github.com/eunseok328/rust-kingbase"
readme = "../README.md"
rust-version = "1.85"

[features]
default = ["runtime"]
runtime = ["tokio-kingbase/runtime"]

[dependencies]
openssl = "0.10"
tokio = "1.0"
tokio-openssl = "0.6"
tokio-kingbase = { version = "0.7.14", path = "../tokio-kingbase", default-features = false }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1.0", features = ["macros", "net", "rt"] }
kingbase = { version = "0.19.8", path = "../kingbase" }

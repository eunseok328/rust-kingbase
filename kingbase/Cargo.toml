[package]
name = "kingbase"
version = "0.19.14"
authors = ["Steven Fackler <sfackler@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A native, synchronous Kingbase client"
repository = "https://github.com/eunseok328/rust-kingbase"
readme = "../README.md"
keywords = ["database", "kingbase", "sql"]
categories = ["database"]
rust-version = "1.85"

[[bench]]
name = "bench"
harness = false

[package.metadata.docs.rs]
all-features = true

[features]
with-kingbase-cert = ["tokio-kingbase/with-kingbase-cert"]
array-impls = ["tokio-kingbase/array-impls"]
with-bit-vec-0_6 = ["tokio-kingbase/with-bit-vec-0_6"]
with-bit-vec-0_7 = ["tokio-kingbase/with-bit-vec-0_7"]
with-bit-vec-0_8 = ["tokio-kingbase/with-bit-vec-0_8"]
with-bit-vec-0_9 = ["tokio-kingbase/with-bit-vec-0_9"]
with-bigdecimal-0_4 = ["tokio-kingbase/with-bigdecimal-0_4"]
with-rust_decimal-1 = ["tokio-kingbase/with-rust_decimal-1"]
with-chrono-0_4 = ["tokio-kingbase/with-chrono-0_4"]
with-cidr-0_2 = ["tokio-kingbase/with-cidr-0_2"]
with-cidr-0_3 = ["tokio-kingbase/with-cidr-0_3"]
with-eui48-0_4 = ["tokio-kingbase/with-eui48-0_4"]
with-eui48-1 = ["tokio-kingbase/with-eui48-1"]
with-geo-types-0_6 = ["tokio-kingbase/with-geo-types-0_6"]
with-geo-types-0_7 = ["tokio-kingbase/with-geo-types-0_7"]
with-jiff-0_1 = ["tokio-kingbase/with-jiff-0_1"]
with-jiff-0_2 = ["tokio-kingbase/with-jiff-0_2"]
with-serde_json-1 = ["tokio-kingbase/with-serde_json-1"]
with-smol_str-01 = ["tokio-kingbase/with-smol_str-01"]
with-uuid-0_8 = ["tokio-kingbase/with-uuid-0_8"]
with-uuid-1 = ["tokio-kingbase/with-uuid-1"]
with-time-0_2 = ["tokio-kingbase/with-time-0_2"]
with-time-0_3 = ["tokio-kingbase/with-time-0_3"]

[dependencies]
bytes = "1.11"
fallible-iterator = "0.2"
futures-util = { version = "0.3.14", default-features = false, features = [
  "sink",
] }
log = "0.4"
tokio-kingbase = { version = "0.7.18", path = "../tokio-kingbase" }
tokio = { version = "1.0", features = ["rt", "time"] }

[dev-dependencies]
criterion = "0.7"
